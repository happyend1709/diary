<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>周日记</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="btn btn-ghost" id="prevMonth" aria-label="上一月">‹</button>
      <h1 id="monthTitle" class="week-title"></h1>
      <button class="btn btn-ghost" id="nextMonth" aria-label="下一月">›</button>
    </header>

    <div id="calendar" class="calendar">
      <div class="week-header">
        <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
      </div>
      <div id="monthGrid" class="week-grid"></div>
    </div>

    <nav class="nav-buttons">
      <a class="btn btn-dark" href="./list.html">日记列表</a>
      <a class="btn btn-dark" href="./tags.html">标签管理</a>
      <button class="btn btn-green" id="exportBtn">导出备份</button>
      <button class="btn btn-orange" id="importBtn">导入备份</button>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
    </nav>

    <p class="hint">点击日期写日记；左右滑动或点箭头切换月份。</p>
  </div>

  <script type="module" src="./js/calendar.js"></script>
</body>
</html>
